<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<title>Eat the Frog</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:transparent; overflow:hidden; user-select:none; -webkit-app-region:drag; }
  body{ display:flex; align-items:center; justify-content:center; font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; }
  .card{ position:relative; width:440px; height:280px; border-radius:26px; overflow:hidden;
    background:radial-gradient(120% 90% at 20% 0%, #15403a 0%, #0c1c19 55%, #0a1311 100%);
    border:1px solid rgba(141,224,211,.18); box-shadow:0 30px 60px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; padding:34px 40px 0; color:#eef5f3;
    animation:pop .45s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop{ from{ opacity:0; transform:scale(.92); } }
  .logo{ width:66px; height:66px; border-radius:18px; background:linear-gradient(135deg,#22d3bb,#0b7a6c);
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 #06483f, 0 14px 30px rgba(0,0,0,.35); }
  .logo svg{ width:50px; height:auto; }
  h1{ margin-top:16px; font-size:24px; font-weight:800; letter-spacing:.3px; }
  .bar{ position:relative; width:100%; margin-top:56px; height:12px; border-radius:99px; background:rgba(255,255,255,.08); }
  .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#0f9d8c,#22d3bb); box-shadow:0 0 18px rgba(34,211,187,.55); }
  /* Fredi hüpft in kleinen Bögen auf dem Balken mit */
  .frog{ position:absolute; left:0%; bottom:9px; width:30px; margin-left:-15px; }
  .frog .hop{ transform-origin:50% 100%; animation:hop .62s infinite; }
  .frog svg{ display:block; width:30px; height:auto; }
  .frog.idle .hop{ animation-duration:.9s; }
  @keyframes hop{
    0%  { transform:translateY(0) scale(1.12,.84); animation-timing-function:cubic-bezier(.2,.7,.4,1); }
    12% { transform:translateY(-3px) scale(.92,1.1); animation-timing-function:cubic-bezier(.3,.6,.5,1); }
    50% { transform:translateY(-20px) scale(1,1); animation-timing-function:cubic-bezier(.5,0,.8,.4); }
    90% { transform:translateY(0) scale(1.06,.9); }
    100%{ transform:translateY(0) scale(1.12,.84); }
  }
  .shadow{ position:absolute; left:50%; bottom:-4px; width:22px; height:5px; margin-left:-11px; border-radius:50%; background:rgba(0,0,0,.45); animation:sh .62s infinite; }
  @keyframes sh{ 0%,90%,100%{ transform:scale(1); opacity:.6; } 50%{ transform:scale(.55); opacity:.25; } }
  .status{ margin-top:18px; width:100%; display:flex; justify-content:space-between; font-size:13px; color:#9db2ad; }
  .status b{ color:#8de0d3; font-weight:700; font-variant-numeric:tabular-nums; }
  .skip{ position:absolute; bottom:14px; font:inherit; font-size:12px; color:#9db2ad; background:none; border:none; text-decoration:underline; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s; -webkit-app-region:no-drag; }
  .skip.show{ opacity:.8; pointer-events:auto; }
</style></head>
<body>
<div class="card">
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-177 -155 360 320" width="360" height="320"> <defs> <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#7ee07a"/><stop offset="1" stop-color="#36a845"/> </linearGradient> </defs> <ellipse cx="0" cy="18" rx="168" ry="122" fill="#1f7a2c" opacity=".35" transform="translate(6 10)"/> <circle cx="-88" cy="-74" r="66" fill="url(#skin)"/> <circle cx="88" cy="-74" r="66" fill="url(#skin)"/> <ellipse cx="0" cy="18" rx="168" ry="122" fill="url(#skin)"/> <circle cx="-88" cy="-78" r="46" fill="#fff"/> <circle cx="88" cy="-78" r="46" fill="#fff"/> <circle cx="-80" cy="-72" r="24" fill="#1b2a24"/> <circle cx="96" cy="-72" r="24" fill="#1b2a24"/> <circle cx="-72" cy="-82" r="8" fill="#fff"/> <circle cx="104" cy="-82" r="8" fill="#fff"/> <ellipse cx="-112" cy="38" rx="26" ry="16" fill="#ff8fa3" opacity=".75"/> <ellipse cx="112" cy="38" rx="26" ry="16" fill="#ff8fa3" opacity=".75"/> <path d="M -96 22 Q 0 112 96 22" fill="none" stroke="#1b2a24" stroke-width="16" stroke-linecap="round"/> <circle cx="-16" cy="-6" r="5" fill="#1f6b2a"/><circle cx="16" cy="-6" r="5" fill="#1f6b2a"/> </svg></div>
  <h1>Eat the Frog</h1>
  <div class="bar"><div class="fill" id="fill"></div>
    <div class="frog" id="frog"><div class="shadow"></div><div class="hop"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-177 -155 360 320" width="360" height="320"> <defs> <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#7ee07a"/><stop offset="1" stop-color="#36a845"/> </linearGradient> </defs> <ellipse cx="0" cy="18" rx="168" ry="122" fill="#1f7a2c" opacity=".35" transform="translate(6 10)"/> <circle cx="-88" cy="-74" r="66" fill="url(#skin)"/> <circle cx="88" cy="-74" r="66" fill="url(#skin)"/> <ellipse cx="0" cy="18" rx="168" ry="122" fill="url(#skin)"/> <circle cx="-88" cy="-78" r="46" fill="#fff"/> <circle cx="88" cy="-78" r="46" fill="#fff"/> <circle cx="-80" cy="-72" r="24" fill="#1b2a24"/> <circle cx="96" cy="-72" r="24" fill="#1b2a24"/> <circle cx="-72" cy="-82" r="8" fill="#fff"/> <circle cx="104" cy="-82" r="8" fill="#fff"/> <ellipse cx="-112" cy="38" rx="26" ry="16" fill="#ff8fa3" opacity=".75"/> <ellipse cx="112" cy="38" rx="26" ry="16" fill="#ff8fa3" opacity=".75"/> <path d="M -96 22 Q 0 112 96 22" fill="none" stroke="#1b2a24" stroke-width="16" stroke-linecap="round"/> <circle cx="-16" cy="-6" r="5" fill="#1f6b2a"/><circle cx="16" cy="-6" r="5" fill="#1f6b2a"/> </svg></div></div></div>
  <div class="status"><span id="msg">Fredi wärmt sich auf …</span><b id="pct">0 %</b></div>
  <button class="skip" id="skip">Ohne Update starten</button>
</div>
<script>
  // Der Balken läuft weich zum Ziel. Beim Suchen kriecht er von selbst bis ~85 %.
  let shown = 0, target = 0, mode = 'check', doneCb = null;
  const fill = document.getElementById('fill'), frog = document.getElementById('frog'),
        pct = document.getElementById('pct'), msg = document.getElementById('msg');
  function frame(){
    if(mode === 'check') target = Math.min(85, target + (85 - target) * 0.018 + 0.05);
    shown += (target - shown) * (mode === 'finish' ? 0.14 : 0.08);
    if(Math.abs(target - shown) < 0.15) shown = target;
    const p = Math.max(0, Math.min(100, shown));
    fill.style.width = p + '%'; frog.style.left = p + '%';
    pct.textContent = Math.round(p) + ' %';
    if(mode === 'finish' && p >= 99.9 && doneCb){ const cb = doneCb; doneCb = null; setTimeout(cb, 250); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.setStatus = t => { msg.textContent = t; };
  window.setDownload = p => { mode = 'download'; target = Math.max(target, Math.min(99, p)); };
  window.showSkip = () => document.getElementById('skip').classList.add('show');
  window.finish = t => new Promise(res => { if(t) msg.textContent = t; mode = 'finish'; target = 100; doneCb = res; });
  document.getElementById('skip').onclick = () => { document.title = 'skip'; };
</script>
</body></html>
